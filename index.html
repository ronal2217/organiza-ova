                <div className="flex items-center justify-between border-b border-slate-200 pb-4">
                  <div>
                    <span className="text-xs font-bold text-indigo-600 uppercase tracking-wider">Módulo 4 de 5</span>
                    <h2 className="text-2xl font-bold text-slate-900">Desafío Evaluativo: Toma de Decisiones</h2>
                    <p className="text-xs text-slate-500">Demuestra tu criterio de priorización. Cada respuesta cuenta con retroalimentación formativa.</p>
                  </div>
                  <button 
                    onClick={() => setCurrentScene(2)}
                    className="text-xs font-semibold text-slate-600 hover:text-indigo-600 bg-white border border-slate-200 px-3 py-1.5 rounded-xl transition shadow-sm"
                  >
                    ← Volver a la Ruta
                  </button>
                </div>

                <div className="space-y-6">
                  {QUIZ_QUESTIONS.map((q, idx) => {
                    const selectedIdx = quizAnswers[q.id];
                    const selectedOption = selectedIdx !== undefined ? q.options[selectedIdx] : null;

                    return (
                      <div key={q.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                        <div className="flex items-center space-x-2 mb-3">
                          <span className="bg-indigo-100 text-indigo-700 text-xs font-bold px-2.5 py-1 rounded-md">
                            Caso {idx + 1}
                          </span>
                          <h4 className="font-bold text-slate-900 text-sm">{q.question}</h4>
                        </div>

                        <div className="space-y-2 mt-4">
                          {q.options.map((opt, oIdx) => {
                            const isSelected = selectedIdx === oIdx;
                            return (
                              <button
                                key={oIdx}
                                disabled={quizSubmitted}
                                onClick={() => setQuizAnswers(prev => ({ ...prev, [q.id]: oIdx }))}
                                className={`w-full text-left p-3.5 rounded-xl border text-xs font-medium transition ${
                                  isSelected
                                    ? 'bg-indigo-50 border-indigo-500 text-indigo-900 font-bold ring-1 ring-indigo-500'
                                    : 'bg-white border-slate-200 hover:border-slate-300 text-slate-700'
                                }`}
                              >
                                <div className="flex items-center space-x-2">
                                  <span className={`w-4 h-4 rounded-full border flex items-center justify-center text-[10px] ${
                                    isSelected ? 'border-indigo-600 bg-indigo-600 text-white' : 'border-slate-300'
                                  }`}>
                                    {isSelected ? '✓' : ''}
                                  </span>
                                  <span>{opt.text}</span>
                                </div>
                              </button>
                            );
                          })}
                        </div>

                        {/* RETROALIMENTACIÓN FORMATIVA INDIVIDUALIZADA */}
                        {quizSubmitted && selectedOption && (
                          <div className={`mt-4 p-4 rounded-2xl text-xs leading-relaxed border ${
                            selectedOption.isCorrect
                              ? 'bg-emerald-50 border-emerald-300 text-emerald-950'
                              : 'bg-rose-50 border-rose-300 text-rose-950'
                          }`}>
                            <div className="font-bold text-sm mb-1 flex items-center space-x-1.5">
                              <span>{selectedOption.isCorrect ? '✅ Respuesta Correcta' : '❌ Respuesta Incorrecta'}</span>
                            </div>
                            <p className="mt-1">{selectedOption.feedback}</p>

                            {!selectedOption.isCorrect && (
                              <div className="mt-2.5 pt-2 border-t border-rose-200/60 text-slate-700 font-medium">
                                💡 <strong>Opción correcta:</strong> {q.options.find(o => o.isCorrect).text}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>

                {!quizSubmitted ? (
                  <button
                    disabled={Object.keys(quizAnswers).length < QUIZ_QUESTIONS.length}
                    onClick={handleEvaluateQuiz}
                    className={`w-full py-4 px-6 rounded-2xl font-bold text-sm shadow-md transition flex items-center justify-center space-x-2 ${
                      Object.keys(quizAnswers).length === QUIZ_QUESTIONS.length
                        ? 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-200'
                        : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                    }`}
                  >
                    <span>CALIFICAR EVALUACIÓN FORMATIVA</span>
                    <span>➔</span>
                  </button>
                ) : (
                  <div className="bg-white rounded-2xl p-6 border border-slate-200 shadow-md text-center space-y-4">
                    <div className="text-3xl">🎯</div>
                    <h3 className="text-xl font-extrabold text-slate-900">
                      Tu Puntaje: <span className={quizScore >= 66 ? 'text-emerald-600' : 'text-rose-600'}>{quizScore}%</span>
                    </h3>
                    <p className="text-xs text-slate-600 max-w-md mx-auto">
                      {quizScore >= 66 
                        ? '¡Felicitaciones! Has demostrado una comprensión sobresaliente de la priorización escolar. ¡Tu diploma está listo!' 
                        : 'Revisa las explicaciones de cada caso arriba para corregir tus dudas y vuelve a intentarlo.'}
                    </p>

                    {quizScore >= 66 ? (
                      <button
                        onClick={() => unlockNextScene(7, 300)}
                        className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg shadow-emerald-200 transition text-sm"
                      >
                        RECLAMAR MI DIPLOMA E INSIGNIA FINAL (+300 XP) ➔
                      </button>
                    ) : (
                      <button
                        onClick={() => {
                          setQuizSubmitted(false);
                          setQuizAnswers({});
                        }}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl text-xs transition"
                      >
                        🔄 Reintentar Evaluación con lo Aprendido
                      </button>
                    )}
                  </div>
                )}

              </div>
            )}

            {/* ESCENA 7: DIPLOMA E INSIGNIA */}
            {currentScene === 7 && (
              <div className="max-w-4xl mx-auto space-y-8 text-center">
                
                <div className="bg-gradient-to-r from-amber-500 via-indigo-600 to-indigo-900 rounded-3xl p-8 text-white shadow-2xl relative overflow-hidden">
                  <div className="relative z-10 space-y-3">
                    <div className="inline-block bg-white/20 backdrop-blur-md px-4 py-1 rounded-full text-xs font-bold uppercase tracking-widest text-amber-200">
                      ¡Misión Cumplida!
                    </div>
                    <h2 className="text-3xl sm:text-4xl font-extrabold tracking-tight">
                      ¡Felicidades, Organizador PRO!
                    </h2>
                    <p className="text-sm text-indigo-100 max-w-xl mx-auto">
                      {studentName || 'Estudiante'}, has completado satisfactoriamente los 5 módulos de OrganIZ@. Tienes las herramientas para vencer la procrastinación.
                    </p>
                    <div className="text-2xl font-black text-amber-300 pt-2">
                      ⭐ Puntaje Final: {xpPoints} Puntos XP
                    </div>
                  </div>
                </div>

                {/* Previsualización del Diploma */}
                <div className="bg-white p-6 sm:p-8 rounded-3xl border-4 border-amber-300 shadow-2xl max-w-3xl mx-auto text-left relative">
                  <div className="border-2 border-indigo-900 p-6 sm:p-8 rounded-2xl relative bg-slate-50/50">
                    <div className="text-center space-y-2 mb-6">
                      <div className="text-xs font-black tracking-widest text-indigo-700 uppercase">
                        ORGANIZ@ • OBJETO VIRTUAL DE APRENDIZAJE
                      </div>
                      <h3 className="text-2xl sm:text-3xl font-black text-slate-900">
                        DIPLOMA DE EXCELENCIA ACADÉMICA
                      </h3>
                      <p className="text-xs text-slate-500">
                        En Gestión del Tiempo, Planificación y Priorización Escolar
                      </p>
                    </div>

                    <div className="text-center space-y-4 my-8">
                      <p className="text-xs text-slate-600 uppercase tracking-widest font-semibold">
                        Acreditado Oficialmente a:
                      </p>
                      <div className="text-3xl sm:text-4xl font-black text-indigo-900 border-b-2 border-amber-400 pb-2 inline-block px-8">
                        {studentName || 'Estudiante Ejemplar'}
                      </div>
                      <p className="text-xs text-slate-600 max-w-md mx-auto italic pt-2">
                        Por haber dominado la Matriz de Eisenhower, diseñar su horario semanal estratégico y superar los dilemas prácticos de gestión escolar.
                      </p>
                    </div>

                    <div className="flex flex-col sm:flex-row items-center justify-between border-t border-slate-200 pt-6 mt-8 text-xs text-slate-600 gap-4">
                      <div>
                        <strong>Nivel:</strong> {schoolGrade}
                      </div>
                      <div className="text-center">
                        <span className="inline-block bg-amber-100 text-amber-900 font-bold px-3 py-1 rounded-full border border-amber-300">
                          🏅 Insignia: Maestro del Tiempo
                        </span>
                      </div>
                      <div>
                        <strong>Fecha:</strong> {new Date().toLocaleDateString('es-ES')}
                      </div>
                    </div>
                  </div>
                </div>

                <canvas 
                  ref={diplomaCanvasRef} 
                  width={1200} 
                  height={850} 
                  style={{ display: 'none' }}
                />

                <div className="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2">
                  <button
                    onClick={generateAndDownloadDiploma}
                    className="w-full sm:w-auto bg-amber-600 hover:bg-amber-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg shadow-amber-200 transition text-sm flex items-center justify-center space-x-2"
                  >
                    <IconDownload />
                    <span>DESCARGAR DIPLOMA OFICIAL (PNG)</span>
                  </button>

                  <button
                    onClick={generateAndDownloadAgenda}
                    className="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-lg shadow-indigo-200 transition text-sm flex items-center justify-center space-x-2"
                  >
                    <IconCalendar />
                    <span>DESCARGAR MI AGENDA SEMANAL (PNG)</span>
                  </button>

                  <button
                    onClick={() => {
                      setCurrentScene(2);
                    }}
                    className="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3.5 px-6 rounded-xl transition text-sm"
                  >
                    Revisar Módulos
                  </button>
                </div>

              </div>
            )}

          </main>

          <footer className="bg-white border-t border-slate-200 mt-12 py-6">
            <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500 space-y-1">
              <p><strong>OrganIZ@: Tu guía digital</strong> — Objeto Virtual de Aprendizaje (OVA) para Instituciones Educativas.</p>
              <p>Enfoque de Diseño Instruccional: Modelo ADDIE + Gamificación Activa + Canvas API Cliente Seguro.</p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
